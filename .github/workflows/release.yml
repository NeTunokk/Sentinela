name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --locked --workspace

      - name: Compilar
        run: cargo build --locked --release --workspace

      - name: Empacotar
        run: |
          set -euo pipefail
          args=(--sem-build)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            args+=(--versao "${GITHUB_REF_NAME#v}")
          fi
          bash scripts/empacotar.sh "${args[@]}"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --locked --release --workspace

      - name: Empacotar
        shell: pwsh
        run: |
          $opcoes = @{ SemBuild = $true }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $opcoes.Versao = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          ./scripts/empacotar.ps1 @opcoes
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publicar:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Conferir arquivos
        run: ls -l dist

      - name: Anexar à release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
