[workspace]
members = [
    "crates/sentinela-core",
    "crates/sentinela-backup",
    "crates/sentinela-runner",
    "crates/sentinela-store",
    "crates/sentinela-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Sentinela Contributors"]

[workspace.dependencies]
anyhow = "1"
askama = "0.16"
async-trait = "0.1"
base64 = "0.22"
bollard = "0.21"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3"
futures-util = "0.3"
glob = "0.3"
hex = "0.4"
rand = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
